# Vectorizor at https://vectordemo.duckdns.org (namespace: personal).
# deploy/deploy.sh fills in IMAGE_TAG; the image is imported straight into k3s's containerd.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vectorizor-data
  namespace: personal
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vectorizor
  namespace: personal
  labels:
    app: vectorizor
spec:
  replicas: 1
  # One SQLite file on a ReadWriteOnce volume: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vectorizor
  template:
    metadata:
      labels:
        app: vectorizor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: vectorizor
          image: vectorizor:IMAGE_TAG
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: TRUST_PROXY
              value: "1"
            - name: VECTORIZOR_DB
              value: /data/vectorizor.db
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vectorizor-data
---
apiVersion: v1
kind: Service
metadata:
  name: vectorizor
  namespace: personal
spec:
  selector:
    app: vectorizor
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Send plain-HTTP visitors to HTTPS. (cert-manager's HTTP-01 challenge uses its own, more specific
# Ingress path, so certificate issuance isn't affected.)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: personal
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vectorizor
  namespace: personal
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: personal-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [vectordemo.duckdns.org]
      secretName: vectordemo-tls
  rules:
    - host: vectordemo.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vectorizor
                port:
                  name: http
